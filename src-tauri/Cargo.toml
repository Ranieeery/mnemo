[package]
name = "mnemo"
version = "2.1.0"
description = "Desktop app to organize and watch a local video library."
authors = ["Ranieeery"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name, which Cargo needs on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "mnemo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "specta"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
thiserror = "2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio = { version = "1.53.2", features = ["fs", "macros", "process", "rt", "sync", "time"] }

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[dev-dependencies]
tempfile = "3.27.0"
